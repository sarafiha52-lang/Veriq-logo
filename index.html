<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veriq Ecosystem - Official Project & Token Portal</title>
    <!-- Etherscan Verification Verification Asset Mapping -->
    <link rel="icon" type="image/svg+xml" href="logo.svg" sizes="32x32">
    <style>
        /* Cyberpunk Dark Interface Design */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: #060913;
            color: #ffffff;
            line-height: 1.6;
        }

        /* Navigation Interface */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background-color: rgba(11, 15, 25, 0.95);
            border-bottom: 1px solid rgba(56, 189, 248, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo {
            font-size: 26px;
            font-weight: 800;
            color: #38bdf8;
            letter-spacing: 1.5px;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }

        .nav-links {
            list-style: none;
            display: flex;
            align-items: center;
        }

        .nav-links li {
            margin-left: 25px;
        }

        .nav-links a {
            color: #9ca3af;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: #38bdf8;
        }

        /* Content Sections */
        section {
            padding: 90px 8%;
        }

        .section-title {
            text-align: center;
            font-size: 36px;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .section-title span {
            color: #38bdf8;
        }

        .section-subtitle {
            text-align: center;
            color: #9ca3af;
            margin-bottom: 50px;
            font-size: 16px;
        }

        /* Hero Element */
        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 130px 20px;
            background: radial-gradient(circle at center, #111c35 0%, #060913 70%);
        }

        .hero h1 {
            font-size: 52px;
            margin-bottom: 20px;
            font-weight: 800;
        }

        .hero h1 span {
            color: #38bdf8;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }

        .hero p {
            font-size: 19px;
            color: #9ca3af;
            max-width: 750px;
            margin-bottom: 35px;
        }

        /* Buttons & Actions */
        .btn-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            background-color: #38bdf8;
            color: #060913;
            padding: 14px 32px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 14px rgba(56, 189, 248, 0.3);
        }

        .btn:hover {
            background-color: #0ea5e9;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background-color: transparent;
            color: #38bdf8;
            border: 2px solid #38bdf8;
            box-shadow: none;
        }

        .btn-secondary:hover {
            background-color: rgba(56, 189, 248, 0.1);
            color: #ffffff;
        }

        /* Etherscan Verification Information Architecture */
        .contract-box {
            background: rgba(17, 24, 39, 0.85);
            border: 1px solid rgba(56, 189, 248, 0.25);
            padding: 30px;
            border-radius: 12px;
            max-width: 750px;
            margin: 0 auto;
            text-align: center;
        }

        .contract-label {
            font-size: 13px;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 12px;
            font-weight: bold;
        }

        .contract-string {
            font-family: 'Courier New', Courier, monospace;
            color: #38bdf8;
            font-size: 16px;
            word-break: break-all;
            background: #0b0f19;
            padding: 14px;
            border-radius: 6px;
            border: 1px solid #1f2937;
            display: block;
            margin-bottom: 20px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .spec-table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }

        .spec-table th, .spec-table td {
            padding: 10px;
            border-bottom: 1px solid #1f2937;
        }

        .spec-table th {
            color: #9ca3af;
        }

        .spec-table td {
            color: #ffffff;
            font-weight: 600;
        }

        /* Token Core Utility Grid */
        .utility-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        .utility-card {
            background-color: #0f172a;
            padding: 35px;
            border-radius: 12px;
            border: 1px solid #1e293b;
            transition: all 0.3s ease;
        }

        .utility-card:hover {
            transform: translateY(-5px);
            border-color: #38bdf8;
            box-shadow: 0 10px 20px rgba(56, 189, 248, 0.05);
        }

        .utility-card h3 {
            color: #38bdf8;
            font-size: 22px;
            margin-bottom: 15px;
        }

        .utility-card p {
            color: #9ca3af;
            font-size: 15px;
        }

        /* Core Roadmap System */
        .roadmap-timeline {
            position: relative;
            max-width: 800px;
            margin: 0 auto;
        }

        .roadmap-timeline::after {
            content: '';
            position: absolute;
            width: 2px;
            background-color: #1e293b;
            top: 0;
            bottom: 0;
            left: 50%;
            margin-left: -1px;
        }

        .roadmap-item {
            padding: 10px 40px;
            position: relative;
            background-color: inherit;
            width: 50%;
        }

        .roadmap-item::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            right: -8px;
            background-color: #060913;
            border: 3px solid #38bdf8;
            top: 15px;
            border-radius: 50%;
            z-index: 1;
        }

        .left { left: 0; text-align: right; }
        .right { left: 50%; }
        .right::after { left: -8px; }

        .roadmap-content {
            padding: 20px 30px;
            background-color: #0f172a;
            position: relative;
            border-radius: 8px;
            border: 1px solid #1e293b;
        }

        .roadmap-content h3 {
            color: #38bdf8;
            margin-bottom: 8px;
            font-size: 18px;
        }

        .roadmap-content p {
            color: #9ca3af;
            font-size: 14px;
        }

        /* Founders & Leadership Information Area */
        .team-grid {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .team-card {
            background-color: #0f172a;
            border: 1px solid #1e293b;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            min-width: 280px;
            max-width: 350px;
        }

        .team-card h3 {
            color: #ffffff;
            font-size: 20px;
            margin-bottom: 5px;
        }

        .team-card .role {
            color: #38bdf8;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .team-card p {
            color: #9ca3af;
            font-size: 14px;
            margin-bottom: 20px;
        }

        /* Footer Infrastructure & Professional Profiles Links */
        footer {
            background-color: #0b0f19;
            padding: 60px 8% 30px 8%;
            border-top: 1px solid #1f2937;
            text-align: center;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .social-icon {
            color: #ffffff;
            background: #1f2937;
            padding: 10px 24px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            border: 1px solid rgba(56, 189, 248, 0.1);
        }

        .social-icon:hover {
            background: #38bdf8;
            color: #060913;
            transform: scale(1.05);
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }

        footer p {
            color: #4b5563;
            font-size: 14px;
        }

        /* Adaptive Architecture Layout */
        @media (max-width: 768px) {
